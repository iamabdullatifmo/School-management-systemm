{% extends "index.html" %}

{% block title %}
Student Registration
{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm border-0 rounded">
      <div class="card-body p-5">

        <h2 class="text-center text-primary mb-4">
          Student Registration
        </h2>

        <form method="POST">

          <!-- Name fields -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="first" class="form-label">First Name</label>
              <input type="text" id="first" name="first" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label for="last" class="form-label">Last Name</label>
              <input type="text" id="last" name="last" class="form-control" required>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>

          <!-- Department -->
          <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select id="department" name="department" class="form-select" required>
              <option value="" disabled selected>Select Department</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Engineering">Engineering</option>
              <option value="Business">Business</option>
            </select>
          </div>

          <!-- Years of Study -->
          <div class="mb-4">
            <label for="years_of_study" class="form-label">Years of Study</label>
            <select name="years_of_study" class="form-select" required>
            <option value="2">Diploma (2 years)</option>
            <option value="1">Certificate (1 year)</option>
            <option value="4">Degree (4 years)</option>
            </select>

          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100">
            Register
          </button>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
