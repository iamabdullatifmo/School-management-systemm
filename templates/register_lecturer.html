{% extends "index.html" %}

{% block title %}
    Register Lecturer
{% endblock %}

{% block body %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Register Lecturer</h2>
    <form action="{{ url_for('register_lecturer.register_lecturer') }}" method="POST" class="p-4 bg-light rounded shadow text-dark">

        <div class="mb-3">
            <label for="first_N" class="form-label">First Name</label>
            <input type="text" id="first_N" name="first_N" class="form-control form-control-lg" required>
        </div>

        <div class="mb-3">
            <label for="last_N" class="form-label">Last Name</label>
            <input type="text" id="last_N" name="last_N" class="form-control form-control-lg" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control form-control-lg" required>
        </div>

        <div class="mb-3">
            <label for="rank" class="form-label">Rank</label>
            <select name="rank" id="rank" class="form-select form-select-lg" required>
                <option value="degree">Degree</option>
                <option value="masters_degree">Masters Degree</option>
                <option value="professor_degree">Professor Degree</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Submit</button>
    </form>
</div>
{% endblock %}
