<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007BFF;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            width: 30%;
        }
        td {
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #eef;
        }
    </style>
</head>
<body>
    
    <h2>Student BIO</h2>

    <table>
        <tr>
            <th>First Name</th>
            <td>{{ bio.first_N }}</td>
        </tr>
        <tr>
            <th>Last Name</th>
            <td>{{ bio.last_N }}</td>
        </tr>
        <tr>
            <th>Full Name</th>
            <td>{{ bio.full_Name }}</td>
        </tr>
        <tr>
            <th>Department</th>
            <td>{{ bio.department }}</td>
        </tr>
        <tr>
            <th>Email</th>
            <td>{{ bio.email }}</td>
        </tr>
    </table>

</body>
</html>
