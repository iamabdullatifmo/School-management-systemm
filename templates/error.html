<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal Server Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .error-box {
            border: 1px solid #e74c3c;
            background-color: #f9e6e6;
            padding: 20px;
            display: inline-block;
            border-radius: 8px;
        }
        h1 {
            color: #e74c3c;
        }
        p {
            margin: 10px 0;
        }
        .debug {
            font-size: 0.9em;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>500 - Internal Server Error</h1>
        <p>Oops! Something went wrong on our end.</p>
        <p>Please try again later.</p>
        <div class="debug">
            <p>If you’re the developer, check your logs for more details.</p>
        </div>
    </div>
</body>
</html>
